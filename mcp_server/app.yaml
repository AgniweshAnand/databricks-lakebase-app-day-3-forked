command:
  - "python"
  - "alpaca_mcp_server.py"

resources:
  - name: requirements
    source:
      path: ./requirements.txt

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: PAPER_STARTING_CASH
    value: "100000"
  - name: MASSIVE_SECRET_SCOPE
    value: "massive"
  - name: MASSIVE_SECRET_KEY
    value: "api-key"
  - name: ALPACA_SECRET_SCOPE
    value: "database"
  - name: ALPACA_KEY_ID_SECRET_KEY
    value: "alpaca-key-id"
  - name: ALPACA_SECRET_KEY_SECRET_KEY
    value: "alpaca-secret-key"
